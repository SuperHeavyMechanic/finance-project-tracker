<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statement Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo { font-size: 22px; font-weight: 700; color: #1d1d1f; }
    header .tagline { font-size: 13px; color: #6e6e73; margin-left: 4px; }

    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* Upload zone */
    .upload-card {
      background: #fff;
      border-radius: 16px;
      border: 2px dashed #c7c7cc;
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .upload-card:hover, .upload-card.dragover {
      border-color: #0071e3;
      background: #f0f6ff;
    }
    .upload-card input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-icon { font-size: 48px; margin-bottom: 16px; }
    .upload-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .upload-sub { font-size: 14px; color: #6e6e73; }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0077ed; }
    .btn:disabled { background: #b0b0b8; cursor: not-allowed; }

    /* Status */
    .status-bar {
      display: none;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 20px;
      border: 1px solid #e0e0e0;
    }
    .status-bar.visible { display: flex; }
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid #e0e0e0;
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 14px; color: #3d3d3f; }

    /* Error */
    .error-box {
      display: none;
      background: #fff0f0;
      border: 1px solid #ffc0c0;
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 20px;
      font-size: 14px;
      color: #c0392b;
    }
    .error-box.visible { display: block; }

    /* Results */
    #results { display: none; margin-top: 32px; }
    #results.visible { display: block; }

    .section-title {
      font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #1d1d1f;
    }

    /* Summary cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .summary-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e0e0e0;
    }
    .summary-card .cat-name { font-size: 12px; color: #6e6e73; margin-bottom: 6px; }
    .summary-card .cat-amount { font-size: 22px; font-weight: 700; color: #1d1d1f; }
    .summary-card .cat-count { font-size: 12px; color: #8e8e93; margin-top: 2px; }

    .total-card {
      background: #0071e3;
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      border: none;
    }
    .total-card .cat-name { color: rgba(255,255,255,0.75); }
    .total-card .cat-amount { color: #fff; }
    .total-card .cat-count { color: rgba(255,255,255,0.65); }

    /* Transactions table */
    .table-wrap {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e0e0e0;
      overflow: hidden;
    }

    .table-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #e0e0e0;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      padding: 8px 14px;
      border: 1px solid #d0d0d5;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #0071e3; }

    .filter-select {
      padding: 8px 14px;
      border: 1px solid #d0d0d5;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fff;
      cursor: pointer;
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #f9f9fb;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { background: #f0f0f5; }
    th .sort-arrow { margin-left: 4px; opacity: 0.4; }
    th.sorted .sort-arrow { opacity: 1; }

    td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid #f0f0f2;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9f9fb; }

    .amount-cell { font-weight: 600; text-align: right; }
    .amount-positive { color: #1d1d1f; }
    .amount-negative { color: #34c759; }

    .category-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 500;
    }

    .cat-color-dining    { background: #fff0e6; color: #c0392b; }
    .cat-color-groceries { background: #e6f9ec; color: #1a7f3c; }
    .cat-color-transport { background: #e8f0ff; color: #1a56db; }
    .cat-color-travel    { background: #f0e6ff; color: #7c3aed; }
    .cat-color-entertain { background: #fff8e6; color: #b45309; }
    .cat-color-shopping  { background: #ffe6f3; color: #9d174d; }
    .cat-color-health    { background: #e6fff4; color: #065f46; }
    .cat-color-subscript { background: #e6f3ff; color: #1e40af; }
    .cat-color-utilities { background: #f0ffe6; color: #3d6b21; }
    .cat-color-home      { background: #fff7e6; color: #92400e; }
    .cat-color-personal  { background: #fce7f3; color: #831843; }
    .cat-color-other     { background: #f3f4f6; color: #374151; }

    .no-results { text-align: center; padding: 40px; color: #8e8e93; font-size: 14px; }

    .export-btn {
      padding: 8px 18px;
      background: #fff;
      border: 1px solid #d0d0d5;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: #1d1d1f;
      transition: background 0.15s;
    }
    .export-btn:hover { background: #f5f5f7; }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .editable-category {
      border: none;
      background: transparent;
      font: inherit;
      cursor: pointer;
      width: 100%;
      outline: none;
      border-radius: 980px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 500;
    }

    @media (max-width: 640px) {
      main { padding: 16px 12px; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      td:nth-child(1), th:nth-child(1) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">💳 Statement Analyzer</div>
  <div class="tagline">— powered by Claude AI</div>
</header>

<main>
  <!-- Upload -->
  <div class="upload-card" id="dropZone">
    <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" />
    <div class="upload-icon">📄</div>
    <div class="upload-title">Drop your credit card statement here</div>
    <div class="upload-sub">Supports PDF, JPG, and PNG · Up to 20 MB</div>
    <button class="btn" onclick="document.getElementById('fileInput').click(); event.stopPropagation();">
      Choose File
    </button>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <div class="status-text" id="statusText">Analyzing your statement with Claude AI…</div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <!-- Results -->
  <div id="results">
    <div class="results-header">
      <div class="section-title">Spending Summary</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="export-btn" onclick="exportCSV()">Export CSV</button>
        <button class="export-btn" onclick="resetApp()">New Statement</button>
      </div>
    </div>

    <div class="summary-grid" id="summaryGrid"></div>

    <div class="section-title" style="margin-top:8px;">All Transactions</div>
    <div class="table-wrap">
      <div class="table-controls">
        <input class="search-input" id="searchInput" placeholder="Search transactions…" oninput="renderTable()" />
        <select class="filter-select" id="categoryFilter" onchange="renderTable()">
          <option value="">All Categories</option>
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('date')">Date <span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('description')">Description <span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('category')">Category <span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('amount')" style="text-align:right">Amount <span class="sort-arrow">↕</span></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const CATEGORIES = [
  "Dining & Restaurants","Groceries","Transportation","Travel",
  "Entertainment","Shopping","Healthcare","Subscriptions",
  "Utilities & Bills","Home & Services","Personal Care","Other"
];

const CAT_CLASS = {
  "Dining & Restaurants": "cat-color-dining",
  "Groceries": "cat-color-groceries",
  "Transportation": "cat-color-transport",
  "Travel": "cat-color-travel",
  "Entertainment": "cat-color-entertain",
  "Shopping": "cat-color-shopping",
  "Healthcare": "cat-color-health",
  "Subscriptions": "cat-color-subscript",
  "Utilities & Bills": "cat-color-utilities",
  "Home & Services": "cat-color-home",
  "Personal Care": "cat-color-personal",
  "Other": "cat-color-other",
};

let allTransactions = [];
let sortKey = 'date';
let sortDir = 1;

// Drag & drop
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
});

document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) processFile(e.target.files[0]);
});

async function processFile(file) {
  showStatus(`Uploading ${file.name}…`);
  hideError();

  const formData = new FormData();
  formData.append('file', file);

  try {
    showStatus('Analyzing your statement with Claude AI…');
    const resp = await fetch('/upload', { method: 'POST', body: formData });
    const data = await resp.json();

    if (!resp.ok || data.error) {
      showError(data.error || 'Unknown error');
      hideStatus();
      return;
    }

    allTransactions = data.transactions.map((t, i) => ({ ...t, _id: i }));
    hideStatus();
    renderResults();
  } catch (err) {
    showError('Network error: ' + err.message);
    hideStatus();
  }
}

function renderResults() {
  document.getElementById('results').classList.add('visible');
  renderSummary();
  populateCategoryFilter();
  renderTable();
}

function renderSummary() {
  const totals = {};
  let grand = 0;

  allTransactions.forEach(t => {
    const amt = parseFloat(t.amount) || 0;
    if (amt <= 0) return; // skip credits for summary
    const cat = t.category || 'Other';
    if (!totals[cat]) totals[cat] = { sum: 0, count: 0 };
    totals[cat].sum += amt;
    totals[cat].count++;
    grand += amt;
  });

  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = '';

  // Total card first
  const totalCard = document.createElement('div');
  totalCard.className = 'summary-card total-card';
  totalCard.innerHTML = `
    <div class="cat-name">Total Charges</div>
    <div class="cat-amount">$${grand.toFixed(2)}</div>
    <div class="cat-count">${allTransactions.length} transactions</div>
  `;
  grid.appendChild(totalCard);

  // Sort categories by spend
  Object.entries(totals)
    .sort((a, b) => b[1].sum - a[1].sum)
    .forEach(([cat, data]) => {
      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `
        <div class="cat-name">${cat}</div>
        <div class="cat-amount">$${data.sum.toFixed(2)}</div>
        <div class="cat-count">${data.count} item${data.count !== 1 ? 's' : ''}</div>
      `;
      grid.appendChild(card);
    });
}

function populateCategoryFilter() {
  const cats = [...new Set(allTransactions.map(t => t.category).filter(Boolean))].sort();
  const sel = document.getElementById('categoryFilter');
  sel.innerHTML = '<option value="">All Categories</option>';
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const catFilter = document.getElementById('categoryFilter').value;

  let rows = allTransactions.filter(t => {
    const matchSearch = !search ||
      (t.description || '').toLowerCase().includes(search) ||
      (t.category || '').toLowerCase().includes(search) ||
      String(t.amount).includes(search) ||
      (t.date || '').toLowerCase().includes(search);
    const matchCat = !catFilter || t.category === catFilter;
    return matchSearch && matchCat;
  });

  rows.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (sortKey === 'amount') { av = parseFloat(av) || 0; bv = parseFloat(bv) || 0; }
    else { av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase(); }
    if (av < bv) return -sortDir;
    if (av > bv) return sortDir;
    return 0;
  });

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="no-results">No transactions found.</td></tr>';
    return;
  }

  rows.forEach(t => {
    const amt = parseFloat(t.amount) || 0;
    const amtClass = amt < 0 ? 'amount-negative' : 'amount-positive';
    const amtStr = (amt < 0 ? '-$' : '$') + Math.abs(amt).toFixed(2);
    const catClass = CAT_CLASS[t.category] || 'cat-color-other';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${t.date || '—'}</td>
      <td>${escHtml(t.description || '—')}</td>
      <td>
        <select class="editable-category category-badge ${catClass}"
                onchange="updateCategory(${t._id}, this.value, this)">
          ${CATEGORIES.map(c => `<option value="${c}" ${c === t.category ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      </td>
      <td class="amount-cell ${amtClass}">${amtStr}</td>
    `;
    tbody.appendChild(tr);
  });
}

function updateCategory(id, newCat, selectEl) {
  const t = allTransactions.find(x => x._id === id);
  if (t) {
    t.category = newCat;
    // update badge color
    const catClass = CAT_CLASS[newCat] || 'cat-color-other';
    selectEl.className = `editable-category category-badge ${catClass}`;
    renderSummary();
    populateCategoryFilter();
  }
}

function sortBy(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = 1; }

  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
  event.currentTarget.classList.add('sorted');
  renderTable();
}

function exportCSV() {
  const headers = ['Date', 'Description', 'Category', 'Amount'];
  const rows = allTransactions.map(t => [
    t.date || '', t.description || '', t.category || '',
    (parseFloat(t.amount) || 0).toFixed(2)
  ]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'statement_expenses.csv';
  a.click();
}

function resetApp() {
  allTransactions = [];
  document.getElementById('results').classList.remove('visible');
  document.getElementById('fileInput').value = '';
  document.getElementById('searchInput').value = '';
  hideError(); hideStatus();
}

function showStatus(msg) {
  document.getElementById('statusText').textContent = msg;
  document.getElementById('statusBar').classList.add('visible');
}
function hideStatus() { document.getElementById('statusBar').classList.remove('visible'); }
function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = '⚠️ ' + msg;
  el.classList.add('visible');
}
function hideError() { document.getElementById('errorBox').classList.remove('visible'); }
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
